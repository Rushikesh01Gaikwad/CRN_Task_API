version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: crn_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - crn_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crn_api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=CRNProductDb;User Id=sa;Password=YourStrong@Passw0rd!;TrustServerCertificate=True;
      - JwtSettings__SecretKey=CRN_Secure_Super_Secret_Key_2026_For_Jwt_Authentication!
      - JwtSettings__Issuer=CRN_API
      - JwtSettings__Audience=CRN_Clients
    ports:
      - "5000:8080"
    networks:
      - crn_network

volumes:
  sqlserver_data:

networks:
  crn_network:
    driver: bridge
